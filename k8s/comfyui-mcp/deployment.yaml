apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-mcp
  namespace: comfyui
  labels:
    app: comfyui-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comfyui-mcp
  template:
    metadata:
      labels:
        app: comfyui-mcp
    spec:
      containers:
        - name: comfyui-mcp
          image: ghcr.io/andreclaudino/comfyui-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: COMFYUI_URL
              value: "http://comfyui.comfyui.svc.cluster.local:8188"
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: comfyui-mcp-secret
                  key: MCP_TOKEN
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: ghcr-io-secret
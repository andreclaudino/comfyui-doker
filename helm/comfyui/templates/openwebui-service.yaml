{{- if .Values.openwebui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "comfyui.fullname" . }}-openwebui
  namespace: {{ include "comfyui.namespace" . }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
spec:
  type: {{ .Values.openwebui.service.type }}
  ports:
    - port: {{ .Values.openwebui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "comfyui.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
{{- end }}

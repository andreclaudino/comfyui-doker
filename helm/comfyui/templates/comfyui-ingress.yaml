{{- if and .Values.comfyui.ingress.enabled .Values.comfyui.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "comfyui.fullname" . }}
  namespace: {{ include "comfyui.namespace" . }}
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.comfyui.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.nginx.enabled }}
    nginx.ingress.kubernetes.io/use-regex: {{ .Values.nginx.useRegex | quote }}
    nginx.ingress.kubernetes.io/rewrite-target: {{ .Values.nginx.rewriteTarget | quote }}
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ .Values.nginx.proxyConnectTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ .Values.nginx.proxySendTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ .Values.nginx.proxyReadTimeout | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    {{- end }}
spec:
  {{- with .Values.comfyui.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.comfyui.ingress.host }}
      http:
        paths:
          - path: {{ .Values.comfyui.ingress.path }}
            pathType: {{ .Values.comfyui.ingress.pathType }}
            backend:
              service:
                name: {{ include "comfyui.fullname" . }}
                port:
                  number: {{ .Values.comfyui.service.port }}
  {{- with .Values.comfyui.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range .Values.comfyui.ingress.additionalIngresses }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "comfyui.fullname" $ }}-{{ .name }}
  namespace: {{ include "comfyui.namespace" $ }}
  labels:
    {{- include "comfyui.labels" $ | nindent 4 }}
  annotations:
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $.Values.comfyui.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "comfyui.fullname" $ }}
                port:
                  number: {{ $.Values.comfyui.service.port }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

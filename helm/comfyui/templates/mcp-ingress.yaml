{{- if and .Values.mcp.enabled .Values.mcp.ingress.enabled .Values.mcp.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "comfyui-mcp.fullname" . }}
  namespace: {{ include "comfyui.namespace" . }}
  labels:
    {{- include "comfyui-mcp.labels" . | nindent 4 }}
  {{- with .Values.mcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mcp.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.mcp.ingress.host }}
      http:
        paths:
          - path: {{ .Values.mcp.ingress.path }}
            pathType: {{ .Values.mcp.ingress.pathType }}
            backend:
              service:
                name: {{ include "comfyui-mcp.fullname" . }}
                port:
                  number: {{ .Values.mcp.service.port }}
  {{- with .Values.mcp.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

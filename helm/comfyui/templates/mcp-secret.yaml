{{- if and .Values.mcp.enabled .Values.mcp.token (not .Values.mcp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "comfyui-mcp.fullname" . }}
  namespace: {{ include "comfyui.namespace" . }}
  labels:
    {{- include "comfyui-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  MCP_TOKEN: {{ .Values.mcp.token | b64enc | quote }}
{{- end }}
